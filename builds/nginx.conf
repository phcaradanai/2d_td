server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.wasm$ {
        add_header Content-Type application/wasm;
        try_files $uri =404;
    }

    location ~* \.pck$ {
        try_files $uri =404;
    }

    gzip on;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/wasm;
}