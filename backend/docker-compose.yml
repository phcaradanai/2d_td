version: "3.9"

services:
  leaderboard-api:
    build:
      context: ./leaderboard-api
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - public_network
    ports:
      - "${API_PORT:-8080}"
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-pg!@1234}@postgres-g2n7i3fz45pwcoztfrzu3lxj-162924326188:5432/${POSTGRES_DB:-td2d_db}?sslmode=disable
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://admin-web}"
      MAX_LEVEL1_WAVE: "60"
      ADMIN_TOKEN: "${ADMIN_TOKEN:-change-me-now}"
      DEFAULT_ACCESS_PROFILE: "${DEFAULT_ACCESS_PROFILE:-demo}"
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-}"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    

  admin-web:
    build:
      context: ./admin-web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: "${VITE_API_BASE_URL:-http://localhost:8080}"
    restart: unless-stopped
    networks:
      - public_network
    ports:
      - "${ADMIN_WEB_PORT:-3000}"
    depends_on:
      - leaderboard-api

networks:
  public_network:
    external: true