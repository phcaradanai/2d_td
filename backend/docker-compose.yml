version: "3.9"

services:
  leaderboard-api:
    build:
      context: ./leaderboard-api
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - public_network
    ports:
      - "${API_PORT:-8080}"
    environment:
      PORT: "8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:-pg!@1234}@postgres-g2n7i3fz45pwcoztfrzu3lxj-101205160032:5432/${POSTGRES_DB:-td2d_db}?sslmode=disable
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-*}"
      MAX_LEVEL1_WAVE: "60"
      ADMIN_TOKEN: "${ADMIN_TOKEN:-admin}"
      DEFAULT_ACCESS_PROFILE: "${DEFAULT_ACCESS_PROFILE:-demo}"
      PUBLIC_BASE_URL: "${PUBLIC_BASE_URL:-http://hrrvh3gci0j81306wurdiper.157.85.103.69.sslip.io}"
      MINIO_ENDPOINT: "${MINIO_ENDPOINT:-minio-g2n7i3fz45pwcoztfrzu3lxj-101205730975:9000}"
      MINIO_ACCESS_KEY: "${MINIO_ACCESS_KEY:-admin}"
      MINIO_SECRET_KEY: "${MINIO_SECRET_KEY:-minio!@1234}"
      MINIO_BUCKET_NAME: "${MINIO_BUCKET_NAME:-td2d-upload}"
      MINIO_USE_SSL: "${MINIO_USE_SSL:-false}"
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:8080/healthz" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  admin-web:
    build:
      context: ./admin-web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: "${VITE_API_BASE_URL:-http://localhost:8080}"
    restart: unless-stopped
    networks:
      - public_network
    ports:
      - "${ADMIN_WEB_PORT:-3000}"
    depends_on:
      - leaderboard-api

networks:
  public_network:
    external: true
