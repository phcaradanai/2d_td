server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;

    types {
        text/html html;
        application/javascript js;
        application/wasm wasm;
        application/octet-stream pck;
        application/json json;
        text/css css;
        image/png png;
        image/jpeg jpg jpeg;
        image/webp webp;
        audio/ogg ogg;
        audio/mpeg mp3;
    }

    location = / {
        try_files /index.html =404;
    }

    location = /index.html {
        try_files $uri =404;
    }

    location ~* \.(wasm|pck|js|worker\.js|audio\.worklet\.js|png|jpg|jpeg|webp|ico|json|css|ogg|mp3)$ {
        try_files $uri =404;

        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }

    location / {
        try_files $uri =404;
    }

    gzip on;
    gzip_types
        application/javascript
        application/wasm
        application/octet-stream
        application/json
        text/css;
}